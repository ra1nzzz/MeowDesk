name: tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖 (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: 安装依赖 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          # windnd 是 Windows-only 拖拽库；导入测试并不需要它，但
          # requirements.txt 标注为可选。CI 显式跳过 windnd 安装。
          Write-Host "skipping windnd on CI (Windows-only drag-and-drop library)"

      - name: 导入检查
        run: |
          python -c "import meowdesk; print('meowdesk', meowdesk.__version__)"
          python -c "from meowdesk.core import ConfigManager, FileDatabase, FileClassifier, FileHandler; print('core ok')"
          python -c "from meowdesk.agent import AgentGateway, CommandRegistry; print('agent ok')"
          python -c "from meowdesk.platform.base import PlatformWindow; print('platform base ok')"

      - name: 运行测试
        run: |
          python -m pytest -q --maxfail=1
