name: 构建并发布 Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install pyinstaller pillow send2trash windnd

      - name: 构建单文件版（standalone）
        run: |
          pyinstaller --noconfirm --onefile --name MeowDesk --distpath . --workpath build\onefile --specpath build\onefile --add-data "assets;assets" --add-data "_gen_html.py;." --add-data "_locate.py;." --add-data "config.json;." --add-data "filedb.json;." --add-data "index_preview.html;." --add-data "README.md;." --icon "assets/icon.ico" --windowed lingxi_droplet.py
          echo "=== 单文件版大小 ==="
          dir MeowDesk.exe

      - name: 重命名单文件版
        shell: powershell
        run: |
          Move-Item -Path MeowDesk.exe -Destination MeowDesk-standalone.exe -Force
          dir MeowDesk-standalone.exe

      - name: 构建完整版（文件夹）
        run: |
          pyinstaller --noconfirm 妙喵桌宠.spec

      - name: 打包完整版为 ZIP
        shell: powershell
        run: |
          Compress-Archive -Path dist/妙喵桌宠/* -DestinationPath MeowDesk.zip
          dir MeowDesk.zip

      - name: 列出构建产物
        shell: powershell
        run: |
          echo "=== 工作目录文件 ==="
          dir *.exe, *.zip
          echo "=== dist 目录 ==="
          dir dist/ -Recurse | Select-Object Length, FullName

      - name: 创建 Release 并上传
        uses: softprops/action-gh-release@v2
        with:
          name: MeowDesk ${{ github.ref_name }}
          body: |
            妙喵桌宠 MeowDesk 自动构建

            ## 下载选项

            ### 🗜️ MeowDesk.zip（完整版，推荐）
            解压到任意目录，双击 `妙喵桌宠.exe` 启动。
            启动稍快，文件结构清晰。

            ### ⚡ MeowDesk-standalone.exe（单文件版）
            单个 exe 文件，无需解压，即下即用。
            首次启动稍慢（自解压），适合便携使用。

            **注意**：Windows 可能提示"Windows 已保护你的电脑"，点击"更多信息"→"仍要运行"即可。
          files: |
            MeowDesk.zip
            MeowDesk-standalone.exe
          generate_release_notes: false
